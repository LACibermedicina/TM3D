<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root{--teal:#47B29F;--teal-escuro:#167D6E;--tinta:#122A2E;--tinta-2:#3E5C60;--papel:#F6FFFC;--verde:#06D6A0;--rosa:#FF6B9D;--amarelo:#FFD166}
*{box-sizing:border-box;font-family:ui-rounded,"Segoe UI",system-ui,sans-serif}
body{width:330px;margin:0;background:linear-gradient(160deg,#F6FFFC,#EAFBF6);color:var(--tinta)}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(135deg,var(--teal),var(--teal-escuro));color:#fff}
header .lg{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px}
header b{font-size:14px}header small{display:block;font-size:10px;opacity:.85}
main{padding:12px 14px}
.status{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 6px 14px rgba(15,92,80,.1);margin-bottom:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#ccc;flex-shrink:0}
.dot.on{background:var(--verde);animation:p 1.6s infinite}
@keyframes p{50%{box-shadow:0 0 0 5px rgba(6,214,160,.25)}}
button{cursor:pointer;border:none;border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;width:100%;transition:transform .15s}
button:hover{transform:translateY(-1px)}
.forte{background:linear-gradient(135deg,var(--teal),var(--teal-escuro));color:#fff}
.suave{background:#fff;color:var(--teal-escuro);border:1px solid #D8EFE8}
.perigo{background:linear-gradient(135deg,var(--rosa),#E0447E);color:#fff}
input,select{width:100%;border:1px solid #D8EFE8;border-radius:10px;padding:9px 11px;font-size:13px;margin:5px 0;background:#FBFFFD}
label{font-size:10px;font-weight:800;color:var(--tinta-2);text-transform:uppercase;letter-spacing:.4px}
.rec{display:flex;align-items:center;gap:9px;background:#fff;border-radius:12px;padding:9px 11px;margin:7px 0;box-shadow:0 4px 10px rgba(15,92,80,.08)}
.rec .em{font-size:20px}.rec b{font-size:12px;display:block}.rec small{font-size:10px;color:var(--tinta-2)}
.rec button{width:auto;padding:6px 10px;font-size:11px;margin-left:auto}
.miudo{font-size:10px;color:var(--tinta-2);text-align:center;margin-top:10px}
.leitura{background:#fff;border-radius:12px;padding:11px;font-size:12px;white-space:pre-wrap;margin-top:8px;border:1px dashed #B9ECD4;max-height:200px;overflow:auto}
#cam{width:100%;border-radius:12px;margin-top:8px}
.dica{font-size:11px;background:#FFF3DC;border-radius:10px;padding:8px 10px;margin:8px 0;color:#7a5200}
</style>
</head>
<body>
<header>
  <div class="lg">🧬</div>
  <div><b>Tm3d · Chaveiro Clínico</b><small>rede tm3d-local-sim · Φgital m3d.pro</small></div>
</header>
<main>
  <div class="status"><span class="dot" id="dot"></span><span id="st-txt">verificando…</span></div>

  <div id="v-parear">
    <label>Servidor do DApp</label>
    <input id="in-server" placeholder="http://localhost:8791">
    <label>Código de 6 dígitos (mostrado no QR do DApp)</label>
    <input id="in-code" inputmode="numeric" maxlength="6" placeholder="●●●●●●" style="font-size:20px;letter-spacing:6px;text-align:center;font-weight:900">
    <button class="forte" id="bt-parear">🔗 Parear com o DApp</button>
    <button class="suave" id="bt-cam" style="margin-top:7px">📷 Ler QR com a câmera</button>
    <video id="cam" hidden muted playsinline></video>
    <div class="dica">💡 Abra o DApp (<b>Início → Gerar QR de pareamento</b>) e digite o código — ou leia o QR. Sem tokens longos!</div>
  </div>

  <div id="v-cofre" hidden>
    <div id="lista"></div>
    <div id="saida"></div>
    <button class="suave" id="bt-atual" style="margin-top:8px">↻ Atualizar lista</button>
    <button class="perigo" id="bt-desparear" style="margin-top:7px">Desparear</button>
  </div>
  <p class="miudo">🔐 decifra só na memória desta aba · nada é enviado a terceiros</p>
</main>
<script src="jsQR.js"></script>
<script src="popup.js"></script>
</body>
</html>
